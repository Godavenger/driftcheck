name: drift

# Runs driftcheck against a public API on a schedule and publishes the result
# (a styled HTML report + a shields.io badge) to GitHub Pages. The badge — not the
# job status — carries pass/fail, so the page always publishes even when drift is found.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC (off the :00 mark)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run driftcheck and build the site
        shell: bash
        run: |
          status=0
          uv run driftcheck check --config demo/config.yaml --report-dir site || status=$?
          # Drift (1) is a valid report to publish. Setup/export failures (2+) aren't.
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
