[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftcheck"
version = "0.1.0"
description = "Detect when a live API drifts from its OpenAPI contract — CLI + CI conformance badge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sharanya Mondal", email = "sharanyamondal9@gmail.com" }]
keywords = ["openapi", "api", "contract-testing", "conformance", "drift", "cli", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.21",
  "jsonref>=1.1",
  "openapi-schema-validator>=0.6",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
driftcheck = "driftcheck.cli:app"

[project.urls]
Homepage = "https://github.com/Godavenger/driftcheck"
Repository = "https://github.com/Godavenger/driftcheck"
Issues = "https://github.com/Godavenger/driftcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["driftcheck"]

[tool.hatch.build.targets.sdist]
include = [
  "/driftcheck",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
  "/config.example.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument in parameter defaults is the idiomatic Typer pattern.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
